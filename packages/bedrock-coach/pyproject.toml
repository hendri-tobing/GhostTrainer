[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-coach"
version = "0.1.0"
description = "GhostTrainer AWS Bedrock AI Fitness Analysis Engine"
authors = [{ name = "GhostTrainer Team" }]
dependencies = [
    "boto3>=1.34.0",
    "pydantic>=2.0.0",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
