name: GhostTrainer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/bedrock-coach
          pip install -r apps/alexa-mcp-server/requirements.txt
          pip install -r apps/ring-simulator/requirements.txt
          pip install -r requirements-ci.txt

      - name: Run Pytest Test Suite
        run: |
          pytest -v packages/bedrock-coach/tests/ apps/ring-simulator/test_ring_simulator.py apps/alexa-mcp-server/test_alexa_mcp.py

  frontend-checks:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/fire-tv-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/fire-tv-app/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Biomechanics & Kinematics Unit Tests
        run: npm test

      - name: Build Fire TV Production Bundle
        run: npm run build

  e2e-demo-smoke:
    name: Cross-Device E2E Demo Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-tests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/bedrock-coach
          pip install -r apps/alexa-mcp-server/requirements.txt
          pip install -r apps/ring-simulator/requirements.txt

      - name: Launch Ring Simulator & Alexa MCP Background Daemons
        run: |
          PYTHONPATH=. python -m uvicorn main:app --app-dir apps/ring-simulator --port 8001 &
          PYTHONPATH=. python -m uvicorn main:app --app-dir apps/alexa-mcp-server --port 8002 &

          echo "Waiting for services to become healthy..."
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8001/health > /dev/null && curl -sf http://127.0.0.1:8002/health > /dev/null; then
              echo "Services became healthy after ${i}s."
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Services failed to become healthy within 15 seconds."
              exit 1
            fi
            sleep 1
          done

      - name: Execute End-to-End Ambient AI Demo
        run: |
          python scripts/demo_flow.py
